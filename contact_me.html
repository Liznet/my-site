<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact me</title>
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }
        .form-card {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #333;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }
        .checkbox-row label {
            margin: 0;
            font-weight: normal;
        }
        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #1c5e88;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2980b9;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h1>Contact me</h1>

        <form action="#" method="post">

            <label for="surname">Фамилия</label>
            <input type="text" id="surname" name="surname" placeholder="Иванов" required>

            <label for="name">Имя</label>
            <input type="text" id="name" name="name" placeholder="Иван" required>

            <label for="email">Электронная почта</label>
            <input type="email" id="email" name="email" placeholder="ivan@example.com" required>

            <label for="phone">Номер телефона</label>
            <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67" required>

            <div class="checkbox-row">
                <input type="radio" id="agree" name="agree" value="yes" required>
                <label for="agree">Согласен(на) на обработку персональных данных</label>
            </div>

            <button type="submit">Отправить</button>
        </form>

        <a class="back" href="index.html">← Назад на главную</a>
    </div>

</body>
</html>
